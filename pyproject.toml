[project]
name = "book-catalog-system"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# Let tests `import openlibrary_search` from the scripts/ folder.
pythonpath = ["scripts"]
testpaths = ["tests"]
