[project]
name = "book-catalog-system"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-htmx>=1.29.0",
    "django-tailwind-cli>=4.8.2",
    "djangorestframework>=3.18.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
# "." lets tests import the Django project.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
extend-exclude = ["*/migrations/*", "prototypes"]

[tool.ruff.lint]
# pycodestyle, Pyflakes, isort, bugbear, pyupgrade, Django-specific checks
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Django's password-validator dotted paths are longer than one line.
"config/settings.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "books", "config"]
