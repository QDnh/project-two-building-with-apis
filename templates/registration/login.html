{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card bg-base-100 shadow-sm max-w-md mx-auto">
  <div class="card-body">
    <h1 class="card-title text-2xl">Sign in</h1>
    {% if next and not user.is_authenticated %}
      <div role="alert" class="alert alert-info alert-soft"><span>Please sign in to see that page.</span></div>
    {% endif %}
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      {% include "_form_fields.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-full mt-4">Sign in</button>
    </form>
    <p class="text-sm mt-2">New here? <a href="{% url 'signup' %}" class="link link-primary">Create an account</a>.</p>
  </div>
</div>
{% endblock %}
